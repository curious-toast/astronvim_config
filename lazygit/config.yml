customCommands:
  - key: <f1>
    context: global
    description: Rebase current branch onto main/master
    command: |
      base="$(git show-ref --verify --quiet refs/heads/main && echo main || echo master)"
      if [ "$(gh repo view --json isFork -q .isFork 2>/dev/null)" = "true" ]; then
        parent="$(gh repo view --json parent -q '.parent.owner.login + "/" + .parent.name')"
        git fetch "https://github.com/$parent.git" "$base" \
          && git push origin "FETCH_HEAD:refs/heads/$base" \
          && git fetch origin "$base" \
          && git rebase "origin/$base"
      else
        git fetch origin "$base" && git rebase "origin/$base"
      fi
    loadingText: Syncing fork and rebasing onto main/master
    output: log
